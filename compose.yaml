name: bingebox

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: bingebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
      POSTGRES_DB: bingebox
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingebox -d bingebox"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://bingebox:${POSTGRES_PASSWORD}@db:5432/bingebox
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/configure.py first}
      MEDIA_ROOT: /data/media
      APP_ORIGIN: http://localhost:${WEB_PORT:-18080}
    volumes:
      - ./media:/data/media
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
